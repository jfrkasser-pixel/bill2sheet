[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bill2sheet"
version = "0.1.0"
description = "Extract vendor, date, net, VAT and total from bill/receipt photos with Tesseract OCR and write them to an .xlsx ledger."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "Pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bill2sheet = "bill2sheet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
